<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Check Universe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, rgba(30, 144, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0, 191, 255, 0.14), transparent 25%),
                linear-gradient(135deg, #05121d 0%, #08223c 45%, #0e3d6b 100%);
            color: #f4f7ff;
            padding: 20px;
        }

        .login-card {
            width: min(420px, 100%);
            background: rgba(10, 24, 41, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            padding: 42px 32px;
            text-align: center;
            backdrop-filter: blur(14px);
        }

        .login-card h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .login-card p {
            color: rgba(255, 255, 255, 0.72);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .oauth-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            color: #102a43;
            background: #ffffff;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .oauth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
            background: #f1f5ff;
        }

        .oauth-button svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        .hint {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.56);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Sign in to Check Universe</h1>
        <p>Use a single secure sign-in method to continue. One click and you&apos;re ready to manage your check
            universe.</p>

        <a class="oauth-button">
            Continue with OAuth
        </a>

        <p class="hint">If your app uses a different provider, update the button URL to the correct OAuth route.</p>
    </main>

    <script>
        const btn = document.querySelector(".oauth-button");

        async function loginWithOAuth() {
            const clientId = "6afdb4ae6c71378618f0f6d69b28707a942d2f3a26c4801040b6d8dc01ae58dc";
            const redirectUrl = "http://localhost:8000/callback.html";
            const state = "zVTBdbYcEXuz9niG";
            const nonce = "HhX7nwSqFak3Gef0";

            sessionStorage.setItem("state", JSON.stringify(state));
            sessionStorage.setItem("nonce", JSON.stringify(nonce));

            window.location.href = `https://oidc-t4w5.onrender.com/o/authenticate?response_type=code&scope=openid&client_id=${clientId}&redirect_url=${redirectUrl}&state=${state}&nonce=${nonce}`
        }

        btn.addEventListener("click", () => {
            loginWithOAuth();
        });
    </script>
</body>

</html>
